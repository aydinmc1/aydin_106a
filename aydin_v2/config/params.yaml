white_patch_detector_node:
  ros__parameters:
    image_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    debug_image_topic: /aydin_v2/white_patches/debug_image
    aruco_dictionary_id: DICT_4X4_50
    aruco_marker_id: 1
    aruco_marker_size: 0.04
    aruco_axis_length: 0.02
    aruco_pose_topic: aruco_poses
    camera_frame: camera_color_optical_frame
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    target_frame: base_link
    snapshot_duration: 3.0
    snapshot_expected_nubs: 11
    snapshot_cluster_radius: 0.025
    snapshot_min_samples: 5
    snapshot_pose_topic: /aydin_v2/nub_snapshot/poses
    snapshot_marker_topic: /aydin_v2/nub_snapshot/markers
    snapshot_frame_prefix: snapshot_nub
    white_min_value: 200
    white_max_saturation: 45
    min_patch_area: 150.0
    max_patch_area: 0.0
    blur_kernel_size: 5
    morph_kernel_size: 5
    enable_tuning_window: true
    tuning_config_path: white_detection_params.json
